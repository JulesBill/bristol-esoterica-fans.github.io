name: Scrape UKC Latest Ascents

on:
  schedule:
    # Run every 4 hours to catch fast-moving ascents on busy days
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

permissions:
  contents: write # Needed to commit the file back to the repository

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pyyaml
          
      - name: Run scraper
        run: python scripts/scrape_ukc.py
        
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _data/latest_local_ascents.yml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): Automated update: latest local ascents" && git push)
